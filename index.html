<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>

    <!-- Bootstrap CSS for Extra Credit -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container game-container">
        <h1>🎲 Dice Game 🎲</h1>

        <!-- Game Rules -->
        <h2>If the dice add to 9 or above, you win $5! <br>
If the dice add to 5 or less, I win $5. <br>
Ready to play?</h2>

        <!-- Dice Images Container -->
        <div class="dice-container">
            <!--
                ⚠️ IMPORTANT: Place your dice images in an 'images' folder
                You need 6 dice images named:
                - images/dice1.svg
                - images/dice2.svg
                - images/dice3.svg
                - images/dice4.svg
                - images/dice5.svg
                - images/dice6.svg
            -->
            <img src="images/dice1.svg" alt="Dice 1" id="dice1">
            <img src="images/dice1.svg" alt="Dice 2" id="dice2">
        </div>

        <!-- Play Button -->
        <button class="btn btn-primary btn-lg btn-play" onclick="rollDice()">Roll the Dice!</button>

        <!-- Result Display -->
        <h3 id="result">Click the button to roll!</h3>
    </div>

    <!-- Footer -->
    <h4>COGS3 - Dice Game Beter - Daniel Cho - 11/21/2025</h4>

    <!-- Link to JavaScript file -->
    <script src="index.js"></script>
</body>
</html>
